# Owned exclusively by Bunkercrew. No existing vhost is overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name bunkercrew.vibechain.rocks;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/bunkercrew/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bunkercrew.vibechain.rocks;
    ssl_certificate /opt/bunkercrew/tls/live/bunkercrew.vibechain.rocks/fullchain.pem;
    ssl_certificate_key /opt/bunkercrew/tls/live/bunkercrew.vibechain.rocks/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BunkercrewTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /opt/bunkercrew/nginx/cloudflare-realip.conf;
    access_log off;
    error_log /var/log/nginx/bunkercrew.error.log warn;
    client_max_body_size 4k;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/bunkercrew/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location = /social {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}
