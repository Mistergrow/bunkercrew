services:
  relay:
    build: .
    restart: unless-stopped
    init: true
    environment:
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:-}
      RELAY_MAX_ROOMS: ${RELAY_MAX_ROOMS:-256}
      RELAY_MAX_CONNECTIONS: ${RELAY_MAX_CONNECTIONS:-768}
      RELAY_MAX_CONNECTIONS_PER_IP: ${RELAY_MAX_CONNECTIONS_PER_IP:-64}
      RELAY_MAX_ROOMS_PER_IP: ${RELAY_MAX_ROOMS_PER_IP:-8}
      RELAY_LOBBY_IDLE_SECONDS: ${RELAY_LOBBY_IDLE_SECONDS:-3600}
      RELAY_MAX_OUTBOUND_BYTES: ${RELAY_MAX_OUTBOUND_BYTES:-67108864}
      SOCIAL_MAX_SESSIONS_PER_IP: ${SOCIAL_MAX_SESSIONS_PER_IP:-8}
      RELAY_TRUSTED_PROXIES: ${RELAY_TRUSTED_PROXIES:-${RELAY_CADDY_IP:-172.30.247.3}/32}
      SOCIAL_DB: /data/social.sqlite3
    volumes:
      - social_data:/data
    networks:
      relay_private:
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 64
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    # Tag and digest as published on Docker Hub on 2026-11-14; refresh together.
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [public]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging: *bounded_logs
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
    networks:
      relay_private:
        ipv4_address: ${RELAY_CADDY_IP:-172.30.247.3}

networks:
  relay_private:
    ipam:
      config:
        - subnet: ${RELAY_PROXY_SUBNET:-172.30.247.0/29}

volumes:
  social_data:
  caddy_data:
  caddy_config:
